# NVIDIA GPUs through CDI: the host's driver libraries and nvidia-smi, from the NVIDIA Container Toolkit's
# specification (sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml)
# (podman compose -f compose.yaml -f compose.nvidia.yaml ...)
services:
  xestrata:
    devices:
      - nvidia.com/gpu=all
    # the host's /dev/dri/by-path, whole: CDI's hook makes the folder with the NVIDIA GPU's links alone, and Intel's
    # driver, which then lists the GPUs from it, finds none of Intel's
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path:ro
