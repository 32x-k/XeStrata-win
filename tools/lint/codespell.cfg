# codespell for XeStrata (tools/lint/run.sh): identifiers it would take for misspellings
[codespell]
ignore-words-list = nd,fo,te,nin,dout,optin,renderd,rcall,caf,espace,aer,thi,fonctions,hsa
# recorded model output in other languages; the quant yardstick's multilingual prompts (data/quant_quality)
skip = */fixtures/*,*/quant_quality/*/multilingual.txt
